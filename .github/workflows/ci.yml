name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and development tools
        run: python -m pip install ".[dev]" "build>=1.2" "setuptools>=69" wheel
      - name: Build release wheel and sdist
        run: python -m build --outdir "$RUNNER_TEMP/release-dist"
      - name: Audit release artifacts and write provenance
        run: |
          python tools/release_artifacts.py \
            --dist "$RUNNER_TEMP/release-dist" \
            --git-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/RELEASE_MANIFEST.json"
      - name: Fresh wheel install release smoke
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv release-venv-wheel
          release-venv-wheel/bin/python -m pip install --no-index --no-deps "$RUNNER_TEMP"/release-dist/scene_factory-0.1.0-py3-none-any.whl
          release-venv-wheel/bin/python "$GITHUB_WORKSPACE/tools/release_smoke.py"
          release-venv-wheel/bin/python "$GITHUB_WORKSPACE/tools/smoke_test_installed_package.py"
      - name: Build wheel from sdist and run install smoke
        working-directory: ${{ runner.temp }}
        run: |
          mkdir sdist-source sdist-wheel
          tar -xzf release-dist/scene_factory-0.1.0.tar.gz -C sdist-source
          cd sdist-source/scene_factory-0.1.0
          python -m build --wheel --outdir "$RUNNER_TEMP/sdist-wheel"
          python -m venv "$RUNNER_TEMP/release-venv-sdist"
          "$RUNNER_TEMP/release-venv-sdist/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/sdist-wheel/scene_factory-0.1.0-py3-none-any.whl
          "$RUNNER_TEMP/release-venv-sdist/bin/python" "$GITHUB_WORKSPACE/tools/release_smoke.py"
          "$RUNNER_TEMP/release-venv-sdist/bin/python" -m pip check
      - name: Structural release check
        run: python tools/check_release.py
      - name: Ruff
        run: python -m ruff check scene_factory tools tests
      - name: Compile
        run: python -m compileall -q scene_factory tools tests
      - name: Test
        run: python -B -m pytest -p no:cacheprovider -q
