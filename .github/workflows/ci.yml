name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build and development tools
        run: python -m pip install ".[dev]" "build>=1.2" "setuptools>=69" wheel
      - name: Build release wheel and sdist
        run: python -m build --outdir "$RUNNER_TEMP/release-dist"
      - name: Audit release artifacts and write provenance
        run: |
          python tools/release_artifacts.py \
            --dist "$RUNNER_TEMP/release-dist" \
            --git-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/RELEASE_MANIFEST.json"
      - name: Fresh wheel install release smoke
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv release-venv-wheel
          release-venv-wheel/bin/python -m pip install --no-index --no-deps "$RUNNER_TEMP"/release-dist/scene_factory-0.1.0-py3-none-any.whl
          release-venv-wheel/bin/python "$GITHUB_WORKSPACE/tools/release_smoke.py"
          release-venv-wheel/bin/python "$GITHUB_WORKSPACE/tools/smoke_test_installed_package.py"
      - name: Build wheel from sdist and run install smoke
        working-directory: ${{ runner.temp }}
        run: |
          mkdir sdist-source sdist-wheel
          tar -xzf release-dist/scene_factory-0.1.0.tar.gz -C sdist-source
          cd sdist-source/scene_factory-0.1.0
          python -m build --wheel --outdir "$RUNNER_TEMP/sdist-wheel"
          python -m venv "$RUNNER_TEMP/release-venv-sdist"
          "$RUNNER_TEMP/release-venv-sdist/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/sdist-wheel/scene_factory-0.1.0-py3-none-any.whl
          "$RUNNER_TEMP/release-venv-sdist/bin/python" "$GITHUB_WORKSPACE/tools/release_smoke.py"
          "$RUNNER_TEMP/release-venv-sdist/bin/python" "$GITHUB_WORKSPACE/tools/smoke_test_installed_package.py"
          "$RUNNER_TEMP/release-venv-sdist/bin/python" -m pip check
      - name: Structural release check
        run: python tools/check_release.py
      - name: Ruff
        run: python -m ruff check scene_factory tools tests
      - name: Compile
        run: python -m compileall -q scene_factory tools tests
      - name: Test
        run: python -B -m pytest -p no:cacheprovider -q

  windows:
    name: Windows core (Python 3.12)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build and development tools
        run: python -m pip install ".[dev]" "build>=1.2" "setuptools>=69" wheel
      - name: Structural release check
        run: python tools/check_release.py
      - name: Ruff
        run: python -m ruff check scene_factory tools tests
      - name: Compile
        run: python -m compileall -q scene_factory tools tests
      - name: Test core workflows
        run: python -B -m pytest -p no:cacheprovider -q
      - name: Build release wheel and sdist
        run: python -m build --outdir "$env:RUNNER_TEMP/release-dist-windows"
      - name: Audit release artifacts and write provenance
        run: >-
          python tools/release_artifacts.py
          --dist "$env:RUNNER_TEMP/release-dist-windows"
          --git-commit "$env:GITHUB_SHA"
          --output "$env:RUNNER_TEMP/RELEASE_MANIFEST_WINDOWS.json"
      - name: Fresh wheel install release smoke
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv release-venv-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releasePython = Join-Path $env:RUNNER_TEMP "release-venv-windows/Scripts/python.exe"
          $releaseWheel = Join-Path $env:RUNNER_TEMP "release-dist-windows/scene_factory-0.1.0-py3-none-any.whl"
          & $releasePython -m pip install --no-index --no-deps $releaseWheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $releasePython "$env:GITHUB_WORKSPACE/tools/release_smoke.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $releasePython "$env:GITHUB_WORKSPACE/tools/smoke_test_installed_package.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $releasePython -m pip check

  browser:
    name: Offline browser preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate, inspect and download scenes in Chromium
        run: python tools/run_web_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-preview-qa
          path: outputs/web-qa

  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MuJoCo integration dependencies
        run: python -m pip install ".[dev,mujoco]"
      - name: Verify simulator dependencies
        run: python -c "import mujoco; import numpy"
      - name: Test MuJoCo integration
        run: python -B -m pytest -p no:cacheprovider -q tests/test_mujoco.py
