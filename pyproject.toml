[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-factory"
version = "0.1.0"
description = "Deterministic scene, task, interaction-planning, and executor contracts for embodied-AI simulation workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
gym = ["gymnasium>=1.0"]
mujoco = ["mujoco>=3.3,<3.4"]

[project.scripts]
scene-factory = "scene_factory.cli:main"
scene-factory-web = "scene_factory.webapp:main"

[tool.setuptools]
packages = ["scene_factory", "scene_factory.backends", "scene_factory.exporters"]
license-files = ["LICENSE"]

[tool.setuptools.data-files]
"share/scene-factory/recipes" = ["recipes/*.json"]
"share/scene-factory/schemas" = ["schemas/*.json"]
"share/scene-factory/web" = ["web/*.html", "web/*.css", "web/*.js"]
"share/scene-factory/web/vendor" = ["web/vendor/*"]
"share/scene-factory/data/assets" = ["data/assets/registry.jsonl"]
"share/scene-factory/data/assets/collision" = ["data/assets/collision/*.usd"]
