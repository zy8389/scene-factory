[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-factory"
version = "0.1.0"
description = "Deterministic scene, task, interaction-planning, and executor contracts for embodied-AI simulation workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
gym = ["gymnasium>=1.0"]

[project.scripts]
scene-factory = "scene_factory.cli:main"
scene-factory-web = "scene_factory.webapp:main"

[tool.setuptools]
packages = ["scene_factory", "scene_factory.backends", "scene_factory.exporters"]
license-files = ["LICENSE"]

[tool.setuptools.data-files]
"share/scene-factory/recipes" = ["recipes/*.json"]
"share/scene-factory/schemas" = ["schemas/*.json"]
"share/scene-factory/web" = ["web/*.html", "web/*.css", "web/*.js"]
"share/scene-factory/data/assets" = ["data/assets/registry.jsonl"]
"share/scene-factory/data/assets/collision" = ["data/assets/collision/*.usd"]
"share/scene-factory/data/assets/metadata" = ["data/assets/metadata/*.json"]
"share/scene-factory/data/assets/qa_reports" = ["data/assets/qa_reports/*.json"]
"share/scene-factory/data/assets/usd" = ["data/assets/usd/*.usd"]
"share/scene-factory/data/assets/source/bowl_001" = [
  "data/assets/source/bowl_001/*.json",
  "data/assets/source/bowl_001/*.glb",
]
"share/scene-factory/data/assets/source/bowl_001/collision" = [
  "data/assets/source/bowl_001/collision/*.glb",
]
"share/scene-factory/data/assets/source/knife_001" = [
  "data/assets/source/knife_001/*.json",
  "data/assets/source/knife_001/*.glb",
]
"share/scene-factory/data/assets/source/knife_001/collision" = [
  "data/assets/source/knife_001/collision/*.glb",
]
"share/scene-factory/data/assets/source/plate_001" = [
  "data/assets/source/plate_001/*.json",
  "data/assets/source/plate_001/*.glb",
]
"share/scene-factory/data/assets/source/plate_001/collision" = [
  "data/assets/source/plate_001/collision/*.glb",
]
"share/scene-factory/data/assets/source/ycb_025_mug" = [
  "data/assets/source/ycb_025_mug/*.json",
  "data/assets/source/ycb_025_mug/*.glb",
]
"share/scene-factory/data/assets/source/ycb_025_mug/collision" = [
  "data/assets/source/ycb_025_mug/collision/*.glb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = { "tools/*.py" = ["E402"] }

[tool.ruff]
line-length = 100
target-version = "py312"
