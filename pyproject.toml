[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = { "tools/*.py" = ["E402"] }

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]
